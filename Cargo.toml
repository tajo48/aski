[package]
name = "aski"
version = "0.1.0"
edition = "2021"
description = "Interactive question popups for MCP agents (Wayland, Catppuccin)"
license = "MIT"

[dependencies]
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt", "macros", "process", "io-util", "time"] }
iced = { version = "0.14", features = ["fira-sans", "tiny-skia", "tokio", "wayland", "x11"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
strip = true
